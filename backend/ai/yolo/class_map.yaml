# Ánh xạ tên lớp YOLO -> nhãn EcoAI.
#
# Khóa: tên lớp trong model YOLO của bạn, được chuẩn hóa (chữ thường, mọi ký tự khác chữ/số -> "_").
#   Ví dụ "Plastic bag & wrapper" -> plastic_bag_wrapper ; "cell phone" -> cell_phone
# Giá trị:
#   * một khóa hướng dẫn có sẵn trong app/services/categories.py (LABEL_GUIDES), hoặc
#   * {category: <organic|recyclable|nonrecyclable|hazardous|ewaste|other>, name: <tên tiếng Việt>}
# Lớp không có trong file này sẽ thuộc nhóm "other" (Rác khác) và hiển thị tên gốc.

